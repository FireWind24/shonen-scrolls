<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12121c"/>
      <stop offset="1" stop-color="#0c0c14"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="128" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <circle cx="256" cy="256" r="240" fill="none" stroke="#ff2e4d" stroke-width="18" filter="url(#glow)"/>

  <circle cx="256" cy="340" r="104" fill="#ffb03a"/>
  <circle cx="256" cy="130" r="24" fill="#ff2e4d"/>

  <g stroke="#f5f2ea" stroke-linecap="round" fill="none">
    <line x1="256" y1="224" x2="256" y2="392" stroke-width="32"/>
    <path d="M156 280 Q256 216 356 280" stroke-width="32"/>
    <line x1="144" y1="216" x2="368" y2="216" stroke-width="56"/>
  </g>
</svg>
