<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search — Shonen Scrolls</title>
  <meta name="description" content="Search anime posters and series." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@300;400;500;600;700;800&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="noise">
  <div class="halftone"></div>
  <div class="page-glow"></div>

  <!-- ================= NAV ================= -->
  <header class="nav" id="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="index.html">
        <img src="assets/logo.svg" alt="Shonen Scrolls" />
        <span>SHONEN<br /><span class="brand-sub">SCROLLS</span></span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="index.html#animes">Series</a>
        <a href="index.html#sizes">Sizes</a>
      </nav>
      <div class="nav-actions">
        <div class="search-wrap" id="searchWrap">
          <svg class="search-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="search" id="searchInput" class="search-input" placeholder="Search" autocomplete="off" />
          <div class="search-drop" id="searchDrop" hidden></div>
        </div>
        <a class="search-mobile" href="search.html" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </a>
        <button class="cart-btn" id="cartToggle" aria-label="Open cart">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.7 9.2a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.6L5 4H2"/><circle cx="9.5" cy="20.5" r="1.5"/><circle cx="17.5" cy="20.5" r="1.5"/></svg>
          <span class="cart-lbl">Cart</span>
          <span class="cart-count" id="cartCount"></span>
        </button>
        <button class="burger" id="burger" aria-label="Menu"><span></span></button>
      </div>
    </div>
  </header>
  <nav class="mobile-menu" id="mobileMenu">
    <a href="index.html">Home</a>
    <a href="index.html#animes">Series</a>
    <a href="index.html#sizes">Sizes</a>
    <a href="search.html">Search</a>
  </nav>

  <main>
    <!-- ================= SEARCH HERO ================= -->
    <section class="search-hero">
      <div class="wrap">
        <span class="kicker reveal">Search</span>
        <h1 class="sec-title reveal" data-delay="1" style="margin-top:12px;">Find your scroll</h1>
        <div class="search-box reveal" data-delay="2">
          <svg class="sb-ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="search" id="pageSearchInput" placeholder="Try “Toji”, “Naruto” or “jujutsu-kaisen”…" autocomplete="off" />
        </div>
        <div class="chips" id="popularChips" aria-label="Popular searches"></div>
      </div>
    </section>

    <section class="section" style="padding-top: 20px;">
      <div class="wrap" id="searchResults"></div>
    </section>
  </main>

  <div id="footerMount"></div>
  <div id="cartMount"></div>
  <div id="modalMount"></div>
  <div id="toastMount"></div>

  <script src="assets/data/manifest.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/site.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
