<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — Shonen Scrolls</title>
  <meta name="description" content="Anime poster gallery. Choose your size and add to cart." />
  <link rel="icon" href="assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="assets/site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@300;400;500;600;700;800&family=Noto+Serif+JP:wght@400;600;700&family=League+Spartan:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="noise">
  <div class="halftone"></div>
  <div class="page-glow"></div>

  <!-- ================= NAV ================= -->
  <header class="nav" id="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="index.html">
        <img src="assets/android-chrome-192x192.png" alt="Shonen Scrolls" />
        <span class="brand-text">Shonen<br />Scrolls</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="index.html#animes">Series</a>
        <a href="index.html#sizes">Sizes</a>
        <a href="custom.html">Custom</a>
      </nav>
      <div class="nav-actions">
        <div class="search-wrap" id="searchWrap">
          <svg class="search-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="search" id="searchInput" class="search-input" placeholder="Search" autocomplete="off" />
          <div class="search-drop" id="searchDrop" hidden></div>
        </div>
        <a class="search-mobile" href="search.html" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </a>
        <button class="cart-btn" id="cartToggle" aria-label="Open cart">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.7 9.2a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.6L5 4H2"/><circle cx="9.5" cy="20.5" r="1.5"/><circle cx="17.5" cy="20.5" r="1.5"/></svg>
          <span class="cart-lbl">Cart</span>
          <span class="cart-count" id="cartCount"></span>
        </button>
        <button class="burger" id="burger" aria-label="Menu"><span></span></button>
      </div>
    </div>
  </header>
  <nav class="mobile-menu" id="mobileMenu">
    <a href="index.html">Home</a>
    <a href="index.html#animes">Series</a>
    <a href="index.html#sizes">Sizes</a>
    <a href="custom.html">Custom design</a>
  </nav>

  <main>
    <!-- ================= ANIME HERO ================= -->
    <section class="anime-hero" id="animeHero">
      <span class="kanji-bg" id="heroKanjiBg" aria-hidden="true"></span>
      <div class="wrap">
        <a class="crumb" href="index.html#animes">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
          Back to the library
        </a>
        <h1 id="heroTitle">…</h1>
        <div class="kanji-line" id="heroKanji"></div>
        <p class="tagline" id="heroTag"></p>
        <div class="hero-stats">
          <div><b id="heroCount">0</b><span>Designs</span></div>
          <div><b id="heroPrice">Rs 100</b><span>From</span></div>
          <div><b id="heroSizes">3</b><span>Sizes</span></div>
        </div>
      </div>
    </section>

    <!-- ================= POSTER GRID ================= -->
    <section class="section" style="padding-top: 70px;">
      <div class="wrap">
        <div class="chips" id="sizeQuick" aria-label="Set size for all posters">
          <span style="font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);align-self:center;margin-right:6px;">Set size</span>
          <button class="chip active" data-size="">Default</button>
          <button class="chip" data-size="A4">All A4</button>
          <button class="chip" data-size="A5">All A5</button>
          <button class="chip" data-size="A6">All A6</button>
        </div>
        <div class="poster-grid" id="posterGrid"></div>
      </div>
    </section>

    <!-- ================= MORE SERIES ================= -->
    <section class="section" id="moreSeries" style="padding-top: 40px;">
      <div class="wrap">
        <div class="sec-head reveal">
          <span class="kicker">Keep scrolling</span>
          <h2 class="sec-title">More from the library</h2>
        </div>
        <div class="anime-grid" id="moreGrid"></div>
      </div>
    </section>
  </main>

  <div id="footerMount"></div>
  <div id="cartMount"></div>
  <div id="modalMount"></div>
  <div id="toastMount"></div>

  <script src="assets/data/manifest.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/site.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/anime.js"></script>
</body>
</html>
